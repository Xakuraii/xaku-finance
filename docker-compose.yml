name: xakufinance

services:
  postgres:
    image: postgres:16-alpine
    container_name: xaku-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xaku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xaku_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-xaku}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xaku} -d ${POSTGRES_DB:-xaku}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xaku-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development-only mail catcher. UI: http://localhost:56381
  mailpit:
    image: axllent/mailpit:latest
    container_name: xaku-mailpit
    ports:
      - "56380:1025"
      - "56381:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
