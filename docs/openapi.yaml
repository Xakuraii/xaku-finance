components:
  schemas:
    Account:
      type: object
      description: Full account representation including dynamic ledger balance.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        account_type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          readOnly: true
        currency:
          type: string
        nature:
          allOf:
          - $ref: '#/components/schemas/NatureEnum'
          readOnly: true
        description:
          type: string
          readOnly: true
          nullable: true
        is_spendable:
          type: boolean
          readOnly: true
        allows_negative_balance:
          type: boolean
          readOnly: true
        display_order:
          type: integer
          readOnly: true
        opened_on:
          type: string
          format: date
          readOnly: true
        is_archived:
          type: boolean
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        archive_reason:
          type: string
          readOnly: true
          nullable: true
        balance:
          type: string
          readOnly: true
        balance_minor:
          type: integer
          readOnly: true
        balance_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_type
      - allows_negative_balance
      - archive_reason
      - archived_at
      - balance
      - balance_display
      - balance_minor
      - created_at
      - currency
      - description
      - display_order
      - id
      - is_archived
      - is_spendable
      - name
      - nature
      - opened_on
      - updated_at
    AccountBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        currency:
          type: string
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
      required:
      - account_type
      - currency
      - id
      - name
    AccountBriefRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        currency:
          type: string
          minLength: 1
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
      required:
      - account_type
      - currency
      - name
    AccountRequest:
      type: object
      description: Full account representation including dynamic ledger balance.
      properties:
        currency:
          type: string
          minLength: 1
      required:
      - currency
    AccountTypeEnum:
      enum:
      - checking
      - savings
      - cash
      - ewallet
      - credit_card
      - investment
      - other
      type: string
      description: |-
        * `checking` - Checking
        * `savings` - Savings
        * `cash` - Cash
        * `ewallet` - E-Wallet
        * `credit_card` - Credit Card
        * `investment` - Investment
        * `other` - Other
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/KindEnum'
        parent_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        icon:
          type: string
          nullable: true
          maxLength: 40
        color:
          type: string
          nullable: true
          maxLength: 7
        is_system:
          type: boolean
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        is_archived:
          type: boolean
        children:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        transaction_count:
          type: integer
          readOnly: true
      required:
      - children
      - id
      - kind
      - name
      - parent_id
      - transaction_count
    CategoryBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 80
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - id
      - kind
      - name
    CategoryBriefRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - kind
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
