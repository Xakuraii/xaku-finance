          type: integer
          readOnly: true
        refresh_expires_in:
          type: integer
          readOnly: true
      required:
      - access
      - access_expires_in
      - refresh_expires_in
      - user
    KindEnum:
      enum:
      - expense
      - income
      type: string
      description: |-
        * `expense` - Expense
        * `income` - Income
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
