openapi: 3.0.3
info:
  title: XakuFinance API
  version: 1.0.0
  description: Personal finance management API. Amounts are decimal strings.
paths:
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Exchange a Google ID token for tokens. Existing accounts must be
        linked.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Exchange email and password for an access token and refresh cookie.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Revoke the current session and clear the refresh cookie.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Revoke every session for the current user.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot_create
      description: 'Always 202: the response never reveals whether the account exists.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Set a new password with a single-use token and revoke every session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate the refresh cookie. Replaying an old token revokes the session
        family.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a user, profile, and workspace atomically, then open a session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_list
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: auth_sessions_destroy
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: Mark the account verified using a single-use token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      description: Send a fresh verification link to the signed-in user.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /health/live:
    get:
      operationId: health_live_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
          description: ''
  /health/ready:
    get:
      operationId: health_ready_retrieve
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - id_token
    GoogleTokenResponse:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        access:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_expires_in:
          type: integer
          readOnly: true
      required:
      - access
      - access_expires_in
      - refresh_expires_in
      - user
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    PasswordForgotRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PasswordResetRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
      required:
      - new_password
      - token
    PasswordResetResponse:
      type: object
      properties:
        reset:
          type: boolean
          readOnly: true
      required:
      - reset
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        timezone:
          type: string
          minLength: 1
          default: UTC
          maxLength: 64
        reporting_currency:
          type: string
          minLength: 1
          default: USD
          maxLength: 3
      required:
      - display_name
      - email
      - password
    RegisterResponse:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        workspace:
          allOf:
          - $ref: '#/components/schemas/WorkspaceSummary'
          readOnly: true
        access:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_expires_in:
          type: integer
          readOnly: true
      required:
      - access
      - access_expires_in
      - refresh_expires_in
      - user
      - workspace
    SentResponse:
      type: object
      properties:
        sent:
          type: boolean
          readOnly: true
      required:
      - sent
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device:
          type: string
          readOnly: true
        approx_location:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
        current:
          type: boolean
          readOnly: true
      required:
      - approx_location
      - created_at
      - current
      - device
      - id
      - last_used_at
    TokenResponse:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        access_expires_in:
          type: integer
          readOnly: true
        refresh_expires_in:
          type: integer
          readOnly: true
      required:
      - access
      - access_expires_in
      - refresh_expires_in
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_email_verified
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - token
    VerifyEmailResponse:
      type: object
      properties:
        verified:
          type: boolean
          readOnly: true
      required:
      - verified
    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        reporting_currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        week_start:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - reporting_currency
      - timezone
      - week_start
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
